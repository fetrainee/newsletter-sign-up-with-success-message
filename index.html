<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./main.js"></script>
    <title>Frontend Mentor | Newsletter sign-up form with success message</title>
</head>
<body>
<main>
    <article class="container">
        <picture class="hero">
            <img src="./assets/images/illustration-sign-up-mobile.svg" alt="background image">
        </picture>
        <div class="wrapper">
            <section class="content">
                <h1 class="content__title">Stay updated!</h1>
                <p class="content__text">Join 60,000+ product managers receiving monthly updates on:</p>
                <ul>
                    <li>Product discovery and building what matters</li>
                    <li>Measuring to ensure updates are a success</li>
                    <li>And much more!</li>
                </ul>
            </section>
            <form class="form__email">
                <label for="email">
                    <span class="label-wrapper">
                        <span class="label-text">Email address</span>
                        <span class="label-error" id="email-error" aria-live="polite"></span>
                    </span>
                    <input id="email" type="email" placeholder="email@company.com">
                </label>
                <button class="form--button" type="button">Subscribe to monthly newsletter</button>
            </form>
        </div>
    </article>
</main>
</body>
</html>
