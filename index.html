<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./main.js"></script>
    <title>Frontend Mentor | Newsletter sign-up form with success message</title>
</head>
<body>
<main>
    <article class="newsletter-signup">
        <picture class="hero">
            <img src="./assets/images/illustration-sign-up-mobile.svg" alt="background image">
        </picture>
        <div class="newsletter-signup__wrapper">
            <section class="newsletter-signup__content">
                <h1 class="newsletter-signup__title">Stay updated!</h1>
                <p class="newsletter-signup__description">Join 60,000+ product managers receiving monthly updates on:</p>
                <ul class="features-list">
                    <li class="features-list__item">Product discovery and building what matters</li>
                    <li class="features-list__item">Measuring to ensure updates are a success</li>
                    <li class="features-list__item">And much more!</li>
                </ul>
            </section>
            <form class="email-form">
                <label class="email-form__label" for="email">
                    <span class="email-form__label-row">
                        <span class="email-form__label-text">Email address</span>
                        <span class="email-form__error" id="email-error" aria-live="polite"></span>
                    </span>
                    <input class="email-form__input" id="email" type="email" placeholder="email@company.com">
                </label>
                <button class="email-form__button" type="button">Subscribe to monthly newsletter</button>
            </form>
        </div>
    </article>
    <section class="success-message">
        <header class="success-message__header">
            <img src="./assets/images/icon-success.svg" alt="success icon">
            <h2 class="success-message__title">Thanks for subscribing!</h2>
            <p class="success-message__description">Check your email for the confirmation link.</p>
        </header>
        <button class="success-message__button" type="button">Dismiss message</button>
    </section>
</main>
</body>
</html>
